# 群晖（Synology Container Manager）部署用 compose
# 与本地开发的 docker-compose.yml 区别：这里直接拉取 GHCR 上构建好的镜像，
# 不再本地 build，因此“更新 = 拉取新镜像”。
#
# 数据持久化关键：./data 映射到容器内 /app/data（宿主机目录），
# 镜像只含代码，db.json 等数据全在宿主机，更新容器不会丢失。
services:
  grid-erp:
    # 已固定为 v2.13.0（稳定发布版本）。日后发布新版本时，需在此改标签（如 :v2.13.1）
    # 并重新 pull，或改回 :main 以追 GitHub main 分支最新。
    # 注：仓库已由 ziliaozizhi-local-erp 更名为 epds，镜像路径随之变更；
    #    epds 下的新包首次推送后默认是 private，需在 Packages 设置里改成 Public 才能免登录拉取。
    image: ghcr.io/wangsvven/epds:v2.13.0
    container_name: grid-erp
    ports:
      - "5173:5173"
    environment:
      - PORT=5173
      - NODE_ENV=production
    volumes:
      - ./data:/app/data      # 务必保持此映射，且部署目录的 ./data 不要删除
    restart: unless-stopped
