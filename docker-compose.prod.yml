# 群晖（Synology Container Manager）部署用 compose
# 与本地开发的 docker-compose.yml 区别：这里直接拉取 GHCR 上构建好的镜像，
# 不再本地 build，因此“更新 = 拉取新镜像”。
#
# 数据持久化关键：./data 映射到容器内 /app/data（宿主机目录），
# 镜像只含代码，db.json 等数据全在宿主机，更新容器不会丢失。
services:
  grid-erp:
    # :main 随 GitHub main 分支最新推送自动更新；如需固定版本可改 :v2.0.0
    image: ghcr.io/wangsvven/ziliaozizhi-local-erp:main
    container_name: grid-erp
    ports:
      - "5173:5173"
    environment:
      - PORT=5173
      - NODE_ENV=production
    volumes:
      - ./data:/app/data      # 务必保持此映射，且部署目录的 ./data 不要删除
    restart: unless-stopped
