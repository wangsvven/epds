name: Build and Push to GHCR

# 触发：推送到 main 分支 / 打 v* 标签 / 手动
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# 最小权限原则：仅读代码、写包
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 安全闸门：确保任何运行时数据都不会被构建进镜像/上传。
      # 本地开发产生的示例数据只存在于 data/ 与 uploads/，二者已被
      # .gitignore 与 .dockerignore 排除；若有人强塞提交，这里直接让构建失败。
      - name: Scan for accidentally-committed runtime data
        run: |
          echo "::group::扫描被追踪的运行时数据文件"
          LEAK=0
          if git ls-files | grep -E '^(data|uploads)/'; then LEAK=1; fi
          if git ls-files | grep -E 'db\.json$'; then LEAK=1; fi
          echo "::endgroup::"
          if [ "$LEAK" -ne 0 ]; then
            echo "::error::检测到运行时数据（data/、uploads/ 或 db.json）被提交，已中止构建。"
            echo "::error::请运行 'git rm -r --cached data uploads' 移除追踪后重新推送。"
            exit 1
          fi
          echo "✓ 未发现被追踪的运行时数据，继续构建。"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch      # main 分支推送 → :main（群晖拉取用这个“最新”标签）
            type=ref,event=tag         # 打 tag 推送 → :v2.0.0 等（可固定版本）
            type=sha,format=short      # 附带 commit 短哈希，便于追溯

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # 仓库是开源的，尽量把镜像包置为公开（多端点探测；仓库关联包 user 端点会 404）
      - name: Make package public (best-effort)
        if: ${{ github.event_name == 'push' }}
        continue-on-error: true
        run: |
          PKG=ziliaozizhi-local-erp
          OWNER=wangsvven
          REPO=wangsvven/ziliaozizhi-local-erp
          echo "=== A) user scope ==="; gh api -X PUT "users/$OWNER/packages/container/$PKG/visibility" -f visibility=public 2>&1 | head -2
          echo "=== B) repo scope ==="; gh api -X PUT "repos/$REPO/packages/container/$PKG/visibility" -f visibility=public 2>&1 | head -2
          echo "=== C) graphql ==="; gh api graphql -f query="mutation{updatePackageVisibility(input:{packageName:\"$PKG\",packageType:CONTAINER,visibility:PUBLIC,packageOwnerType:USER}){clientMutationId}}" 2>&1 | head -2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
