  <script>
    // 首屏决定明暗，避免刷新时闪一下白底（用户选择优先，其次跟随系统）
    (function () {
      try {
        var saved = localStorage.getItem('erp_theme');
        var dark = saved ? saved === 'dark' : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
        // 已登录（有 token）不需要登录页背景骨架：直接露应用底色，避免照片一闪
        if (localStorage.getItem('erp_token')) document.documentElement.classList.add('has-token');
      } catch (e) {}
    })();

    /* ===== 登录页：Apple 液态玻璃（Liquid Glass） ===== */

    .login-wrap { position:relative; height:100vh; height:100dvh; display:flex; align-items:center; justify-content:center; overflow:hidden; background-color:var(--login-bg-color, #0d1f33); }
    /* 旋转容器：包裹 LQIP 与大图层，旋转时整体变换（角度由服务端按设置注入） */

    /* LQIP：超小模糊占位图，先于大图绘制，避免黑屏/闪白 */
    .login-bg-lqip { position:absolute; inset:-3%; background-image:var(--login-bg-lqip, none); background-size:cover; background-position:center; background-repeat:no-repeat; filter:blur(18px); transform:scale(1.05); transition:opacity .45s ease; }
    /* 背景由 CSS 变量承载：服务端渲染时直接注入当前值，避免前端异步切换造成闪跳 */
    .login-bg-layer { position:absolute; inset:0; background-image:var(--login-bg, none); background-repeat:no-repeat; background-position:center center; background-size:cover; transition:opacity .45s ease; }
    /* 极轻的四周暗角 + 底部渐变：只压边角、保留中心画面清晰度 */
    .login-wrap::after { content:''; position:absolute; inset:0; z-index:1; pointer-events:none;

    /* 环境光斑：缓慢漂移的柔光，为玻璃层提供可“折射”的液体层次 */
    .login-ambient { position:absolute; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
    .login-ambient span { position:absolute; border-radius:50%; filter:blur(64px); mix-blend-mode:screen; will-change:transform; }
    .login-ambient .b1 { width:46vmax; height:46vmax; left:-8vmax; top:-12vmax; opacity:.34;
      background:radial-gradient(circle at 40% 40%, rgba(120,180,255,.85), rgba(120,180,255,0) 68%); animation:lgDrift1 26s ease-in-out infinite alternate; }
    .login-ambient .b2 { width:38vmax; height:38vmax; right:-6vmax; bottom:-10vmax; opacity:.30;

    .login-ambient .b3 { width:28vmax; height:28vmax; right:14vmax; top:-8vmax; opacity:.22;

    @keyframes lgDrift1 { from { transform:translate3d(0,0,0) scale(1); } to { transform:translate3d(6vmax,4vmax,0) scale(1.12); } }
    @keyframes lgDrift2 { from { transform:translate3d(0,0,0) scale(1.05); } to { transform:translate3d(-5vmax,-3vmax,0) scale(.95); } }
    @keyframes lgDrift3 { from { transform:translate3d(0,0,0) scale(.95); } to { transform:translate3d(-4vmax,6vmax,0) scale(1.1); } }
    /* 卡片：半透明玻璃 + 高饱和背景模糊 + 顶部内高光 + 底部折射反光 */
    .login-card { position:relative; z-index:2; width:404px; max-width:calc(100vw - 32px);
      padding:22px 36px 32px; border-radius:32px; overflow:hidden;
      background:

        radial-gradient(80% 62% at 104% 116%, rgba(190,225,255,.15), rgba(255,255,255,0) 62%),
        linear-gradient(158deg, rgba(18,26,41,.32) 0%, rgba(14,22,36,.18) 46%, rgba(22,32,48,.30) 100%);
      -webkit-backdrop-filter:blur(26px) saturate(230%);
      backdrop-filter:blur(26px) saturate(230%);
      box-shadow:
        0 34px 76px -20px rgba(0,10,30,.62),

  html.dark .el-dialog__footer, html.dark .el-drawer { background: var(--surface); }

  /* ===== 通用面板 / 分段控件 / 列表容器 ===== */
  .panel { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow-sm); }

  @media (max-width:768px){ .proj-bar .bar-spacer { display:none; } .proj-bar .el-button { width:100%; } }
  /* ===== 项目信息（详情页响应式网格） ===== */
  .proj-info-grid { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; }

  /* ===== 计划管理（周计划 / 月计划） ===== */

  /* ===== 日期时间选择器（计划开始/结束时间，对齐原系统） ===== */
  .pdt { position:relative; width:100%; }
  .pdt-input { display:flex; align-items:center; gap:6px; height:32px; padding:0 10px; border-radius:8px; cursor:pointer;

    transition:box-shadow .15s; user-select:none; }
  .pdt-input:hover { box-shadow:0 0 0 1px var(--line-strong) inset; }
  .pdt.is-open .pdt-input { box-shadow:0 0 0 1px var(--brand) inset, 0 0 0 3px rgba(51,112,255,.14); }

  .pdt-input.is-disabled { background:var(--surface-3); cursor:not-allowed; color:var(--text-3); }

  .pdt-input:hover .pdt-clear { display:flex; }
  .pdt-input:hover .pdt-ico { display:none; }
  .pdt-clear:hover { color:var(--text-2); }

  .pdt-panel { position:fixed; z-index:3000; background:var(--surface); border:1px solid var(--line);
    border-radius:12px; box-shadow:var(--shadow-md); overflow:hidden; }
  .pdt-body { display:flex; }
  .pdt-cal { flex:1 1 auto; min-width:0; padding:0 10px 10px; }
  .pdt-head { display:flex; align-items:center; justify-content:center; gap:2px; height:44px; }
  .pdt-nav { width:26px; height:26px; border:0; background:transparent; color:var(--text-3); font-size:15px; line-height:1;
    border-radius:6px; cursor:pointer; font-family:inherit; }
  .pdt-nav:hover { background:var(--hover); color:var(--text-1); }
  .pdt-title { flex:1 1 auto; display:flex; align-items:center; justify-content:center; gap:8px;

  .pdt-week span { text-align:center; font-size:12.5px; color:var(--text-3); }
  .pdt-grid { display:grid; grid-template-columns:repeat(7, 1fr); row-gap:2px; }
  .pdt-day { height:34px; display:flex; align-items:center; justify-content:center; font-size:13.5px;
    color:var(--text-1); border-radius:8px; cursor:pointer; }

  .pdt-day.today { box-shadow:0 0 0 1px var(--brand) inset; color:var(--brand); }
  .pdt-day.on { background:var(--brand); color:#fff; font-weight:600; box-shadow:none; }
  /* 时间区：抬头行（时/分/秒）+ 三列循环滚动（可视 7 行 × 36px = 252px，与日历区等高） */
  .pdt-time { flex:0 0 158px; display:flex; flex-direction:column; border-left:1px solid var(--line); }
  .pdt-time-head { display:flex; align-items:center; height:44px; }
  .pdt-time-head span { flex:1 1 0; text-align:center; font-size:12.5px; color:var(--text-3); }
  .pdt-cols { position:relative; display:flex; height:252px; }
  /* 选中带：贯通三列的浅蓝带（在数字下层，pointer-events 关掉不吃点击） */
  .pdt-band { position:absolute; left:0; right:0; top:108px; height:36px; z-index:0; pointer-events:none;
    background:#ecf5ff; border-top:1px solid #d9ecff; border-bottom:1px solid #d9ecff; }
  html.dark .pdt-band { background:rgba(51,112,255,.18); border-top-color:rgba(51,112,255,.34); border-bottom-color:rgba(51,112,255,.34); }
  .pdt-col { position:relative; z-index:1; flex:1 1 0; min-width:0; height:100%; overflow-y:auto; scrollbar-width:none;

    mask-image:linear-gradient(to bottom, transparent 0, #000 16%, #000 84%, transparent 100%); }
  .pdt-col::-webkit-scrollbar { width:0; height:0; }
  .pdt-col + .pdt-col { border-left:1px solid var(--line); }
  .pdt-cell { height:36px; line-height:36px; text-align:center; font-size:13px; color:var(--text-2); cursor:pointer; }
  .pdt-cell:hover { background:var(--hover); color:var(--text-1); }
  .pdt-cell.on { color:var(--brand); font-weight:600; }
  .pdt-foot { display:flex; align-items:center; justify-content:space-between; padding:8px 12px; border-top:1px solid var(--line); }
  .pdt-now { border:0; background:transparent; color:var(--text-2); font-size:12.5px; cursor:pointer;
    padding:4px 2px; font-family:inherit; border-radius:6px; }
  .pdt-now:hover { color:var(--brand); }
  .pdt-ok { border:0; background:transparent; color:var(--brand); font-size:12.5px; font-weight:600; cursor:pointer;
    padding:4px 10px; border-radius:6px; font-family:inherit; }
  .pdt-ok:hover { background:var(--brand-soft); }
  .pdt-ok:disabled { color:var(--text-3); cursor:not-allowed; background:transparent; }
  @media (max-width:768px){
    .pdt-time { flex:0 0 132px; }
    .pdt-cols { height:232px; }   /* 与移动端日历区（数字 31px）等高 */

  /* 入库核对徽标：紧凑描边徽标（深浅色通用） */
  .in-chip { display:inline-block; padding:0 8px; border-radius:4px; font-size:12px; line-height:18px;
    border:1px solid var(--ok-line); background:var(--ok-bg); color:var(--ok-text); white-space:nowrap; }

  /* ===== 材料明细：统计卡（与下方表格等宽对齐） ===== */
  .mat-stats { display: grid; grid-template-columns: 1fr 1.5fr 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .mat-stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow-sm); padding: 13px 18px; min-width: 0; overflow: hidden; }
  .mat-stat-lb { font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mat-stat-v { margin-top: 6px; font-size: 24px; font-weight: 700; color: var(--brand);
    font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mat-stat-v.sm { font-size: 17.5px; display: flex; align-items: baseline; gap: 16px; }

  .mat-stat-v .st-danger { color: var(--danger-text); }
  .mat-stat-v .st-muted { color: var(--text-3); }
  /* 材料明细分页条 */
  .mat-pager { display: flex; justify-content: flex-end; align-items: center; gap: 14px; margin-top: 12px; flex-wrap: wrap; }
  .mat-pager-total { color: var(--text-2); font-size: 13px; white-space: nowrap; }
  /* ===== 到货统计 ===== */
  .as-sum { font-size: 12.5px; color: var(--text-2); }
  .as-stats { margin-top: 2px; }
  .as-progress { display: flex; align-items: center; gap: 10px; }
  .as-progress .el-progress { flex: 1; min-width: 0; }
  .as-pct { font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; width: 52px; text-align: right; }
  .as-flag { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 3px; font-size: 11px;
    line-height: 17px; background: rgba(230,147,44,.12); color: var(--warn-text); white-space: nowrap; }
  .as-flag.is-warn { background: rgba(245,108,108,.12); color: var(--danger-text); }
  .as-reason { margin-left: 8px; font-size: 12px; color: var(--danger-text); }

  /* ===== 材料明细表：排版美化 ===== */
  .mat-table { --el-table-border-color: var(--line); --el-table-row-hover-bg-color: var(--hover); font-size: 12.5px; }

  .mat-qty-main { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 6px; }

<body>
  <!-- 极光渐变唯一定义：顶栏与登录页共用（深版 / 亮版各一条），页面内不得再出现同 id 定义 -->
  <svg class="brand-defs" aria-hidden="true" focusable="false" width="0" height="0"
       style="position:absolute;width:0;height:0;overflow:hidden">
    <defs>
      <!-- 深版：浅色底上用 -->
      <linearGradient id="epdGradDeep" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#0a84ff"/>
        <stop offset="0.28" stop-color="#5e5ce6"/>
        <stop offset="0.52" stop-color="#bf5af2"/>
        <stop offset="0.76" stop-color="#ff375f"/>
        <stop offset="1" stop-color="#ff9f0a"/>
      </linearGradient>
      <!-- 亮版：照片 / 玻璃等深底上用 -->
      <linearGradient id="epdGradBright" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#57c8ff"/>
        <stop offset="0.30" stop-color="#7d7aff"/>
        <stop offset="0.55" stop-color="#e07fff"/>
        <stop offset="0.78" stop-color="#ff7d9c"/>
        <stop offset="1" stop-color="#ffb35c"/>
      </linearGradient>
    </defs>
  </svg>
  <div id="app">
    <!-- 首屏骨架：未登录时先按登录页同一套图层画出背景，Vue 挂载时整体替换，
         避免「浅灰底 → 照片」的闪白（服务端注入的 --login-bg / LQIP / 平均色直接生效） -->
    <div id="boot" aria-hidden="true">
      <div class="login-wrap">
        <div class="login-bg-rotate">
          <div class="login-bg-lqip"></div>
          <div class="login-bg-layer"></div>
        </div>
        <div class="login-ambient"><span class="b1"></span><span class="b2"></span><span class="b3"></span></div>
      </div>
    </div>
  </div>
  <script src="/vendor/vue.global.prod.js"></script>

  <script src="/js/main.js"></script>
</body>
